name: CI - Gradle

on:
  push:
    branches:
      - main
      - dev
      - monisha
      - feature/**
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🔹 TEMPORARY while you don't have a Gradle project yet
      - name: Temporary placeholder
        run: echo "Gradle pipeline wired. Replace this step with ./gradlew when project is ready."

      # 🔹 LATER: when you create a Gradle project with wrapper, delete the step above
      #    and UNCOMMENT the two steps below
